version: '3'

services:
  payload:
    image: node:24-alpine
    ports:
      - "3000:3000"
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: game_archive
      POSTGRES_PASSWORD: game_archive_dev
      POSTGRES_DB: game_archive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  node_modules:
